<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#031725"/>
      <stop offset=".42" stop-color="#0d3c56"/>
      <stop offset=".74" stop-color="#4c7f8c"/>
      <stop offset="1" stop-color="#e3ba8c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe3ae" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#ffd09a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffc98b" stop-opacity="0"/>
