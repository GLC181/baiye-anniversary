<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#031725">
  <meta name="description" content="百业一周年 — 关于照片、视频与文字的周年纪念展示网页。">
  <title>百业一周年 · Anniversary Archive</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-locked">

  <div class="scroll-progress" id="scrollProgress" aria-hidden="true"><span></span></div>

  <!-- ============ 开场动态影片 ============ -->
  <div class="intro" id="intro" aria-label="开场动画">
    <canvas id="introCanvas"></canvas>
    <video id="introVideo" playsinline muted autoplay preload="auto" aria-hidden="true"></video>
    <div class="intro-vignette" aria-hidden="true"></div>
    <div class="intro-center" aria-hidden="true">
      <span class="intro-rule"></span>
      <span class="intro-kicker">ONE YEAR TOGETHER</span>
      <span class="intro-wordmark">百业一周年</span>
    </div>
    <button class="intro-skip" id="introSkip" type="button" aria-label="跳过开场动画">
      <span id="introSkipText">跳过</span>
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="intro-hint" id="introHint" aria-hidden="true"></div>
  </div>

  <main id="main">

    <!-- ============ 主题海报 ============ -->
    <section class="hero" id="hero" aria-label="主题海报">
      <div class="hero-media" id="heroMedia">
        <div class="hero-layer hero-surface"><img id="heroSurface" alt="周年海报主画面"></div>
        <div class="hero-layer hero-deep"><img id="heroDeep" alt="周年海报次画面"></div>
        <canvas class="hero-bubbles" id="heroBubbles" aria-hidden="true"></canvas>
        <div class="hero-tint" aria-hidden="true"></div>
      </div>
      <div class="hero-content reveal-in">
        <p class="eyebrow" id="heroEyebrow"></p>
        <h1 class="hero-title" id="heroTitle"></h1>
        <p class="hero-sub" id="heroSub"></p>
        <div class="hero-meta">
          <span class="meta-dot" aria-hidden="true"></span>
          <span id="heroMeta">ANNIVERSARY · ONE YEAR TOGETHER</span>
        </div>
      </div>
      <div class="scroll-cue" aria-hidden="true">
        <span id="heroScrollHint"></span>
        <span class="scroll-line"><i></i></span>
      </div>
    </section>

    <div class="wave-divider" data-wave aria-hidden="true"></div>

    <!-- ============ 图片展示 ============ -->
    <section class="section gallery" id="gallery" aria-label="图片展示区">
      <header class="section-head reveal">
        <p class="eyebrow" id="galleryEyebrow"></p>
        <div class="head-row">
          <h2 id="galleryTitle"></h2>
          <p class="section-sub" id="gallerySub"></p>
        </div>
      </header>

      <div class="marquee-stack reveal" id="marqueeStack">
        <div class="marquee-viewport"><div class="marquee-track" id="trackTop"></div></div>
        <div class="marquee-viewport"><div class="marquee-track" id="trackBottom"></div></div>
      </div>

      <div class="focus" id="focus" aria-hidden="true" role="dialog" aria-modal="true" aria-label="单张照片展示">
        <div class="focus-shade" id="focusShade"></div>
        <button class="focus-close" id="focusClose" type="button" aria-label="退出单张照片展示">
          <span id="focusCloseText"></span>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <div class="focus-stage">
          <div class="focus-card" id="focusCard" tabindex="0" role="button" aria-label="点击翻转照片">
            <div class="focus-face focus-front"><img id="focusImg" alt=""></div>
            <div class="focus-face focus-back">
              <span class="focus-index" id="focusTag"></span>
              <h3 id="focusTitle"></h3>
              <span class="focus-divider" aria-hidden="true"></span>
              <p id="focusText"></p>
            </div>
          </div>
        </div>
        <p class="focus-hint" id="focusHint"></p>
      </div>
    </section>

    <div class="wave-divider wave-alt" data-wave aria-hidden="true"></div>

    <!-- ============ 视频展示 ============ -->
    <section class="section video-section" id="videoSection" aria-label="视频展示区">
      <header class="section-head reveal">
        <p class="eyebrow" id="videoEyebrow"></p>
        <div class="head-row">
          <h2 id="videoTitle"></h2>
          <p class="section-sub" id="videoDesc"></p>
        </div>
      </header>

      <div class="video-shell reveal" id="videoShell">
        <div class="video-stage" id="videoStage">
          <video id="realVideo" playsinline loop preload="metadata"></video>
          <canvas id="videoCanvas" aria-label="动态画面"></canvas>
          <img class="video-poster" id="videoPoster" alt="视频封面">
          <button class="video-bigplay" id="videoBigPlay" type="button" aria-label="播放">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
          </button>
        </div>

        <aside class="video-ui">
          <div class="video-ui-head">
            <span class="ui-index">02 — MOTION</span>
            <span class="ui-status" id="videoStatus"><i></i> STANDBY</span>
          </div>
          <div class="video-ui-body">
            <span class="ui-vertical">ANNIVERSARY / IN MOTION</span>
            <div class="ui-current">
              <span class="ui-current-index" id="uiIndex">01 / 06</span>
              <p class="ui-current-title" id="uiTitle">水墨群像</p>
              <span class="ui-current-tag" id="uiTag">遙渊</span>
            </div>
          </div>
          <div class="video-ui-foot">
            <div class="video-controls">
              <button class="ctrl-btn" id="playToggle" type="button" aria-label="播放或暂停">
                <svg class="icon-play" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
                <svg class="icon-pause" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M8 5h3v14H8zM14 5h3v14h-3z" fill="currentColor"/></svg>
                <span id="playLabel">播放</span>
              </button>
              <div class="volume-box">
                <button class="ctrl-icon" id="muteToggle" type="button" aria-label="静音切换">
                  <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M16 9c1.4 1.6 1.4 4.4 0 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                </button>
                <input type="range" id="volumeRange" min="0" max="1" step="0.01" aria-label="音量">
              </div>
            </div>
            <div class="video-progress" aria-hidden="true"><span id="videoProgress"></span></div>
            <div class="video-time" id="videoTime">00:00 / 00:24</div>
          </div>
        </aside>
      </div>

      <div class="video-picker reveal" id="videoPicker">
        <div class="picker-head">
          <span class="picker-label" id="pickerLabel"></span>
          <span class="picker-hint" id="pickerHint"></span>
        </div>
        <div class="picker-list" id="pickerList" role="listbox" aria-label="视频列表"></div>
      </div>
    </section>

    <div class="wave-divider" data-wave aria-hidden="true"></div>

    <!-- ============ 弹幕留言墙 ============ -->
    <section class="section danmaku-section" id="danmakuSection" aria-label="留言墙">
      <header class="section-head reveal">
        <p class="eyebrow" id="danmakuEyebrow"></p>
        <div class="head-row">
          <h2 id="danmakuTitle"></h2>
          <p class="section-sub" id="danmakuSub"></p>
        </div>
      </header>

      <div class="danmaku-stage reveal" id="danmakuStage" aria-live="polite"></div>

      <form class="danmaku-form reveal" id="danmakuForm" autocomplete="off">
        <input type="text" id="danmakuInput" maxlength="60" aria-label="留言内容">
        <button type="submit" id="danmakuSend">
          <span id="danmakuSendText"></span>
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 12h15m-6-6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </section>

    <!-- ============ 联系方式 ============ -->
    <section class="section contact" id="contact" aria-label="联系方式">
      <div class="contact-inner reveal">
        <p class="eyebrow" id="contactEyebrow"></p>
        <h2 id="contactTitle"></h2>
        <p class="contact-desc" id="contactDesc"></p>
        <a class="mail-link" id="mailLink" href="mailto:2899353374@qq.com">
          <span id="mailText">2899353374@qq.com</span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14m-6-6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <span class="contact-button-text" id="contactButtonText"></span>
      </div>
      <footer class="site-footer" id="siteFooter"></footer>
    </section>

  </main>

  <script src="config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
